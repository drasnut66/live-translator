[package]
name = "live-translator-desktop"
version = "0.1.0"
description = "Japanese to Chinese live subtitle desktop overlay"
authors = ["Mon3tr"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "live_translator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `cuda` enables whisper-rs's CUDA backend on Windows. It is OFF by default so
# CI (no CUDA toolchain) compiles a CPU-only build; local CUDA builds pass
# `--features cuda`. The local build script `build_cuda.ps1` does this.
[features]
default = []
cuda = ["whisper-rs/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
keyring = "=4.1.6"
live-translator-core = { path = "../../core" }
cpal = "=0.18.1"
rubato = "=0.16.2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# speakrs builds everywhere (ONNX CPU path); macOS adds the coreml feature below.
speakrs = { git = "https://github.com/avencera/speakrs.git" }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }
screencapturekit = { version = "=8.0.1", features = ["macos_13_0"] }
speakrs = { git = "https://github.com/avencera/speakrs.git", features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "=0.23.0"
whisper-rs = { version = "=0.16.0" }

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
whisper-rs = "=0.16.0"
