name: Release desktop bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-x64 is intentionally omitted: speakrs -> ort-sys has no
          # prebuilt onnxruntime for x86_64-apple-darwin.
          - platform: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Live Translator ${{ github.ref_name }}"
          releaseBody: "Unsigned personal-use desktop bundles for macOS and Windows."
          releaseDraft: true
          args: ${{ matrix.args }}
