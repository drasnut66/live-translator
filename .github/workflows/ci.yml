name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - run: cargo test --manifest-path core/Cargo.toml

  desktop:
    name: Desktop checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        working-directory: desktop
      - run: cargo check --manifest-path src-tauri/Cargo.toml
        working-directory: desktop
      - name: Validate shell helpers
        if: runner.os == 'macOS'
        run: sh -n scripts/download_models.sh scripts/transcribe_media.sh
      - name: Validate PowerShell helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content -Raw 'scripts/download_models.ps1')) | Out-Null"
